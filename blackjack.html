<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack with AI Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .playing-card {
            width: 80px;
            height: 112px;
            border-radius: 8px;
            background-color: white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 4px;
            position: relative;
        }
        .card-red { color: red; }
        .card-black { color: black; }
        .card-back {
            background-color: #0d47a1;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.1) 10px, rgba(255,255,255,0.1) 20px);
        }
        .rank-top-left { position: absolute; top: 4px; left: 8px; font-size: 16px; }
        .suit-center { font-size: 40px; }
        .rank-bottom-right { position: absolute; bottom: 4px; right: 8px; font-size: 16px; transform: rotate(180deg); }

        .hand-container {
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px;
            margin: 8px;
            transition: all 0.3s;
        }
        .hand-active { border-color: #fbbf24; background-color: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-green-800 text-white min-h-screen font-sans flex flex-col">

    <!-- Header & Settings -->
    <header class="p-4 bg-green-900 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">BLACKJACK AI PRO</h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <label for="apiKey" class="text-sm text-gray-300">Gemini API Key:</label>
                <input type="password" id="apiKey" class="px-2 py-1 rounded text-black w-48 text-sm" placeholder="AI Review Needs Key">
            </div>
            <div class="bg-black/30 px-4 py-2 rounded-lg font-mono">
                Balance: $<span id="balanceDisplay">1000</span>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-8 relative">

        <!-- Game Messages -->
        <div id="gameMessage" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl font-bold text-yellow-300 z-10 bg-black/70 px-8 py-4 rounded-xl hidden text-center whitespace-pre-line w-max"></div>

        <!-- Dealer Area -->
        <div class="mb-12 w-full max-w-4xl flex flex-col items-center">
            <h2 class="text-xl mb-2 text-gray-200">Dealer</h2>
            <div id="dealerCards" class="flex justify-center min-h-[120px]"></div>
            <div id="dealerScore" class="mt-2 font-mono text-lg text-gray-300 hidden">Score: <span id="dealerScoreVal">0</span></div>
        </div>

        <!-- Players Area (Multiple hands for splits) -->
        <div id="playersArea" class="flex flex-wrap justify-center w-full max-w-6xl mb-8 min-h-[160px]">
            <!-- Hands will be injected here -->
        </div>

    </main>

    <!-- Control Panel -->
    <footer class="bg-green-900 p-6 flex flex-col items-center gap-4 shadow-inner min-h-[120px]">

        <!-- Betting Controls -->
        <div id="bettingControls" class="flex gap-4 items-center">
            <span class="text-gray-300">Place Bet:</span>
            <button class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full font-bold shadow-lg transition" onclick="placeBet(10)">$10</button>
            <button class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full font-bold shadow-lg transition" onclick="placeBet(25)">$25</button>
            <button class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full font-bold shadow-lg transition" onclick="placeBet(100)">$100</button>
            <button class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-full font-bold shadow-lg transition ml-4" onclick="clearBet()">Clear</button>
            <div class="ml-4 font-mono text-xl text-yellow-400 w-48">Current Bet: $<span id="currentBetDisplay">0</span></div>
            <button id="dealBtn" class="bg-yellow-500 hover:bg-yellow-400 text-black px-8 py-2 rounded-full font-bold shadow-lg transition ml-4 disabled:opacity-50" onclick="dealInitialCards()" disabled>DEAL</button>
        </div>

        <!-- Action Controls -->
        <div id="actionControls" class="flex gap-4 hidden">
            <button id="hitBtn" class="bg-green-600 hover:bg-green-500 px-6 py-3 rounded-lg font-bold shadow-lg transition disabled:opacity-50" onclick="playerAction('Hit')">HIT</button>
            <button id="standBtn" class="bg-red-600 hover:bg-red-500 px-6 py-3 rounded-lg font-bold shadow-lg transition disabled:opacity-50" onclick="playerAction('Stand')">STAND</button>
            <button id="doubleBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold shadow-lg transition disabled:opacity-50" onclick="playerAction('Double')">DOUBLE</button>
            <button id="splitBtn" class="bg-purple-600 hover:bg-purple-500 px-6 py-3 rounded-lg font-bold shadow-lg transition disabled:opacity-50" onclick="playerAction('Split')">SPLIT</button>
            <button id="surrenderBtn" class="bg-gray-600 hover:bg-gray-500 px-6 py-3 rounded-lg font-bold shadow-lg transition disabled:opacity-50" onclick="playerAction('Surrender')">SURRENDER</button>
        </div>

        <!-- Insurance Controls -->
        <div id="insuranceControls" class="flex gap-4 items-center hidden bg-yellow-900/50 p-4 rounded-xl">
            <span class="text-yellow-300 font-bold">Insurance?</span>
            <button class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-bold shadow-lg transition" onclick="handleInsurance(true)">YES</button>
            <button class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-lg font-bold shadow-lg transition" onclick="handleInsurance(false)">NO</button>
        </div>

        <!-- AI Review Button -->
        <div id="aiReviewContainer" class="hidden mt-2">
            <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-full font-bold shadow-[0_0_15px_rgba(79,70,229,0.5)] transition animate-pulse" onclick="requestAIReview()">
                ✨ View AI Review
            </button>
            <button class="bg-gray-600 hover:bg-gray-500 text-white px-8 py-3 rounded-full font-bold shadow-lg transition ml-4" onclick="resetGameUI()">
                Next Hand
            </button>
        </div>
    </footer>

    <!-- AI Review Modal -->
    <div id="aiModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50">
        <div class="bg-gray-900 border border-indigo-500 p-8 rounded-2xl max-w-2xl w-full mx-4 shadow-[0_0_30px_rgba(79,70,229,0.3)] max-h-[80vh] flex flex-col">
            <h2 class="text-2xl font-bold text-indigo-400 mb-4 flex items-center gap-2">
                <span>🤖</span> AI Coach Review
            </h2>
            <div id="aiLoading" class="text-gray-400 hidden animate-pulse mb-4">Analyzing your play...</div>
            <div id="aiContent" class="text-gray-200 space-y-4 whitespace-pre-wrap overflow-y-auto flex-grow pr-2"></div>
            <button class="mt-6 bg-gray-700 hover:bg-gray-600 px-6 py-2 rounded text-white font-bold transition w-full" onclick="closeAIModal()">Close</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
